<!doctype html>
<!--
  Repo-root entry point — a signpost, not the site.

  The site lives in public/. GitHub Pages can be told to publish it two ways:

    Settings → Pages → Source → GitHub Actions
        .github/workflows/pages.yml uploads public/ and it is served at the
        site root. This file is not part of that artifact, so it is never used.

    Settings → Pages → Source → Deploy from a branch (main / root)
        Pages publishes the repository as-is, which puts the site one level
        down at /public/. This page forwards visitors there so the plain
        project URL still opens the studio.

  Prefer the first. This exists so the second is not a dead end.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Pilates Studio</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="public/index.html">
<meta http-equiv="refresh" content="0; url=public/index.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e8a88c'/></svg>">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #faf7f3;
    color: #1b1917;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 1.5rem;
  }
  .name { font-size: 1.3rem; letter-spacing: 0.34em; text-indent: 0.34em; }
  .sub { font-size: 0.6rem; letter-spacing: 0.34em; text-transform: uppercase; color: #6b635b; margin-top: 0.5rem; }
  p { color: #6b635b; font-size: 0.9rem; margin: 2rem 0 1.25rem; }
  a {
    display: inline-block;
    background: #e8a88c;
    color: #23201d;
    text-decoration: none;
    padding: 0.8rem 1.6rem;
    border-radius: 4px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <main>
    <div class="name">CORE</div>
    <div class="sub">Pilates Studio</div>
    <p>Taking you to the studio&hellip;</p>
    <a href="public/index.html">Enter the site</a>
  </main>
  <script>location.replace('public/index.html');</script>
</body>
</html>
