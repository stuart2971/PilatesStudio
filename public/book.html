<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Class — Core Pilates Studio</title>
<meta name="description" content="Choose a class, date and time that works for you. Book online in four steps.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e8a88c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <header class="page-head">
    <div class="container">
      <h1 style="font-size:clamp(2.2rem,4.5vw,3.1rem)">Book a Class</h1>
      <p class="lede">Select a class, date and time that works for you.</p>
    </div>
  </header>

  <section style="padding-bottom:clamp(4rem,8vw,6rem)">
    <div class="container">

      <div class="steps" id="steps"></div>

      <!-- Steps 1 & 2 ------------------------------------------------- -->
      <div id="screen-pick">
        <div class="book-layout">
          <section class="panel">
            <div class="panel-head"><h2>Choose a Class</h2></div>
            <div class="choice-list" id="class-list">
              <div class="skeleton" style="height:56px;margin:.5rem 0"></div>
              <div class="skeleton" style="height:56px;margin:.5rem 0"></div>
              <div class="skeleton" style="height:56px;margin:.5rem 0"></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head"><h2>Select a Date</h2></div>
            <div class="cal-head">
              <strong id="cal-label">—</strong>
              <div class="cal-nav">
                <button id="cal-prev" aria-label="Previous month">
                  <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button id="cal-next" aria-label="Next month">
                  <svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                </button>
              </div>
            </div>
            <div class="cal-grid" id="cal-dow"></div>
            <div class="cal-grid" id="cal-days"></div>

            <div style="margin-top:1.6rem">
              <div class="panel-head" style="padding-bottom:.7rem;margin-bottom:.7rem">
                <h3 style="font-size:1rem;font-family:var(--sans);font-weight:600">Available Times</h3>
              </div>
              <div class="times" id="times">
                <p class="muted" style="font-size:.88rem;margin:0">Pick a class and a date to see times.</p>
              </div>
            </div>
          </section>
        </div>

        <div class="panel spread" style="margin-top:1.4rem" id="pick-bar">
          <div id="pick-summary" class="muted" style="font-size:.9rem">Nothing selected yet.</div>
          <button class="btn" id="to-details" disabled>Continue</button>
        </div>
      </div>

      <!-- Step 3 ------------------------------------------------------ -->
      <div id="screen-details" class="hidden">
        <div class="book-layout">
          <section class="panel">
            <div class="panel-head"><h2>Your Details</h2></div>
            <div id="details-body"></div>
          </section>
          <aside class="panel" id="details-summary"></aside>
        </div>
        <div class="panel spread" style="margin-top:1.4rem">
          <button class="btn btn-ghost btn-sm" data-back="pick">Back</button>
          <button class="btn" id="to-confirm">Continue to Confirm</button>
        </div>
      </div>

      <!-- Step 4 ------------------------------------------------------ -->
      <div id="screen-confirm" class="hidden">
        <div class="book-layout">
          <section class="panel">
            <div class="panel-head"><h2>Confirm &amp; Pay</h2></div>
            <div id="confirm-body"></div>
          </section>
          <aside class="panel" id="confirm-side"></aside>
        </div>
        <div class="panel spread" style="margin-top:1.4rem">
          <button class="btn btn-ghost btn-sm" data-back="details">Back</button>
          <button class="btn" id="do-book">Confirm Booking</button>
        </div>
      </div>

      <!-- Done -------------------------------------------------------- -->
      <div id="screen-done" class="hidden">
        <div class="panel center" style="padding:3.5rem 1.5rem">
          <div id="done-body"></div>
        </div>
      </div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/static-api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/book.js"></script>
</body>
</html>
